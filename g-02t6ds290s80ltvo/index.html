<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preikestolen Villa — Ryfylke</title>
<meta name="description" content="An exclusive holiday villa in the heart of Ryfylke, Norway." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --stone-900:#1c1f1d;--moss:#5b6b54;--moss-deep:#404c3c;
    --linen:#ece9e1;--paper:#faf8f2;--gold:#c9a25a;
    --serif:"Fraunces",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);font-weight:300;color:#fff;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  ::selection{background:var(--moss);color:var(--paper)}
  a{color:inherit;text-decoration:none}

  .stage{position:relative;min-height:100vh;display:flex;
    align-items:center;justify-content:center;overflow:hidden}
  .bg{position:absolute;inset:0;background-image:url('forside-bg.jpg');
    background-size:cover;background-position:center;
    transform:scale(1.08);animation:zoom 26s ease-out forwards}
  @keyframes zoom{to{transform:scale(1)}}
  .stage::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(20,24,20,.5)0%,
      rgba(20,24,20,.35)45%,rgba(20,24,20,.75)100%)}

  .inner{position:relative;z-index:2;text-align:center;padding:0 26px;
    max-width:760px}
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.4em;
    text-transform:uppercase;opacity:0;transform:translateY(20px);
    animation:rise 1.2s var(--ease) .2s forwards;color:rgba(255,255,255,.85)}
  h1{font-family:var(--serif);font-weight:300;
    font-size:clamp(2.8rem,8vw,6rem);line-height:1.08;margin:24px 0 0;
    text-shadow:0 2px 36px rgba(0,0,0,.35);
    opacity:0;transform:translateY(26px);
    animation:rise 1.3s var(--ease) .35s forwards}
  .tagline{margin-top:26px;font-size:clamp(1rem,2.3vw,1.3rem);
    font-weight:300;opacity:0;transform:translateY(22px);
    animation:rise 1.3s var(--ease) .55s forwards}
  .tagline span{opacity:.92}
  .divider{width:46px;height:1px;background:rgba(255,255,255,.5);
    margin:42px auto;opacity:0;animation:fade 1.4s ease .8s forwards}
  .soon{font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    opacity:0;animation:fade 1.4s ease .95s forwards;color:rgba(255,255,255,.75)}
  .cta{margin-top:48px;opacity:0;transform:translateY(20px);
    animation:rise 1.3s var(--ease) 1.15s forwards}
  .cta a{display:inline-flex;align-items:center;gap:12px;
    border:1px solid rgba(255,255,255,.5);padding:16px 34px;
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    border-radius:2px;transition:all .45s var(--ease);backdrop-filter:blur(2px)}
  .cta a:hover{background:var(--paper);color:var(--stone-900);
    border-color:var(--paper)}
  .cta a::after{content:"→";transition:transform .4s var(--ease)}
  .cta a:hover::after{transform:translateX(7px)}
  .direct{margin-top:26px;font-size:13px;letter-spacing:.04em;
    color:rgba(255,255,255,.7);opacity:0;
    animation:fade 1.4s ease 1.35s forwards}
  .direct a{color:#fff;border-bottom:1px solid rgba(255,255,255,.4);
    padding-bottom:1px;transition:border-color .35s var(--ease)}
  .direct a:hover{border-color:#fff}

  .footer{position:absolute;bottom:30px;left:0;right:0;z-index:2;
    text-align:center;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:rgba(255,255,255,.6);
    opacity:0;animation:fade 1.6s ease 1.4s forwards}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}

  @media(max-width:600px){
    .cta a{padding:15px 28px}
    .divider{margin:34px auto}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="inner">
      <div class="eyebrow">Ryfylke · Norway</div>
      <h1>Preikestolen Villa</h1>
      <p class="tagline"><span>A quiet retreat by the fjord, in the heart of Ryfylke</span></p>
      <div class="divider"></div>
      <div class="soon">Now available for booking</div>
      <div class="cta">
        <a href="https://www.airbnb.com/rooms/1437093492640779471" target="_blank" rel="noopener">Book on Airbnb</a>
      </div>
      <p class="direct">For direct booking enquiries: <a href="mailto:booking@preikestolenvilla.com">booking@preikestolenvilla.com</a></p>
    </div>
    <div class="footer">Preikestolen Villa — Ryfylke, Norway</div>
  </div>
</body>
</html>
