<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Preikestolen Villa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f2eb; --paper:#fff; --ink:#1c1f1d; --muted:#6f746b;
    --moss:#5b6b54; --moss-deep:#404c3c; --gold:#a48652;
    --line:rgba(0,0,0,.1); --line2:rgba(0,0,0,.06);
    --err:#b4453a; --ok:#5b8c47;
    --serif:"Fraunces", Georgia, serif;
    --sans:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);
    font-weight:300;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--moss-deep);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit}
  input,textarea,select{font:inherit;color:inherit}

  /* ─── LOGIN ─── */
  .login{min-height:100vh;display:grid;place-items:center;
    background:linear-gradient(135deg,#1c2620 0%,#2a3a30 100%);color:#f3ece0;
    padding:32px}
  .login-box{width:100%;max-width:380px;text-align:center}
  .login h1{font-family:var(--serif);font-weight:300;font-size:32px;
    letter-spacing:-.01em;margin-bottom:8px}
  .login h1 em{font-style:italic;color:#c0a273}
  .login p.sub{color:rgba(243,236,224,.6);margin-bottom:28px;font-size:14px}
  .login form{display:flex;flex-direction:column;gap:12px}
  .login input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    color:#fff;padding:14px 18px;border-radius:4px;font-size:15px;
    transition:border-color .2s}
  .login input::placeholder{color:rgba(243,236,224,.5)}
  .login input:focus{outline:none;border-color:#c0a273}
  .login button{background:#c0a273;color:#1c2620;border:none;
    padding:14px 22px;font-weight:600;letter-spacing:.04em;border-radius:4px;
    cursor:pointer;text-transform:uppercase;font-size:12px;
    transition:background .2s}
  .login button:hover{background:#d8b572}
  .login .err{color:#e89c93;font-size:13px;margin-top:14px;min-height:20px}
  .login-back{display:inline-block;margin-top:30px;font-size:12px;
    letter-spacing:.18em;text-transform:uppercase;color:rgba(243,236,224,.55)}
  .login-back:hover{color:#c0a273;text-decoration:none}

  /* ─── APP SHELL ─── */
  .app{display:none}
  .app.show{display:flex;flex-direction:column;min-height:100vh}
  header.top{background:var(--paper);border-bottom:1px solid var(--line);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10}
  .brand{font-family:var(--serif);font-style:italic;font-size:18px}
  .brand strong{font-style:normal;font-weight:500}
  header.top .right{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}
  header.top a.view{color:var(--moss-deep);font-weight:500}
  header.top button.logout{background:none;border:1px solid var(--line);
    padding:7px 14px;border-radius:4px;cursor:pointer;color:var(--muted);
    font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  header.top button.logout:hover{border-color:var(--moss-deep);color:var(--moss-deep)}

  nav.tabs{background:var(--paper);border-bottom:1px solid var(--line);
    padding:0 28px;display:flex;gap:0;overflow-x:auto}
  nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;
    padding:14px 18px;cursor:pointer;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;
    transition:color .2s,border-color .2s}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--moss-deep);border-bottom-color:var(--moss-deep)}

  main.work{flex:1;padding:28px;max-width:1100px;margin:0 auto;width:100%}
  .pane{display:none}
  .pane.show{display:block}

  /* Save bar — sticky bottom */
  .savebar{position:sticky;bottom:0;background:#1c1f1d;color:#f3ece0;
    margin:24px -28px -28px;padding:14px 28px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    border-top:1px solid rgba(255,255,255,.1);z-index:9}
  .savebar .status{font-size:13px;color:rgba(243,236,224,.65)}
  .savebar .status.dirty{color:#e8c97a}
  .savebar .status.ok{color:#a8d090}
  .savebar .status.err{color:#e89c93}
  .savebar .actions{display:flex;gap:10px}
  .savebar button{padding:10px 20px;border-radius:4px;border:none;cursor:pointer;
    font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .savebar .save{background:#c0a273;color:#1c1f1d}
  .savebar .save:hover{background:#d8b572}
  .savebar .save:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.4);
    cursor:not-allowed}
  .savebar .revert{background:transparent;color:rgba(243,236,224,.65);
    border:1px solid rgba(243,236,224,.18)}
  .savebar .revert:hover{color:#f3ece0;border-color:#f3ece0}

  /* ─── FIELDS ─── */
  .section{background:var(--paper);border:1px solid var(--line2);
    border-radius:6px;padding:24px 28px;margin-bottom:18px}
  .section h2{font-family:var(--serif);font-weight:400;font-size:22px;
    margin-bottom:6px;color:var(--ink)}
  .section h2 em{font-style:italic;color:var(--gold)}
  .section .help{font-size:13px;color:var(--muted);margin-bottom:20px}

  .row{display:grid;grid-template-columns:200px 1fr;gap:18px;
    padding:14px 0;border-bottom:1px solid var(--line2)}
  .row:last-child{border-bottom:none}
  .row label{font-size:13px;color:var(--muted);padding-top:8px;
    font-weight:500;letter-spacing:.02em}
  .row label small{display:block;font-size:11px;color:#999;font-weight:400;
    margin-top:3px;text-transform:none;letter-spacing:0}
  .row input[type=text],.row textarea,.row select{width:100%;
    border:1px solid var(--line);padding:9px 12px;border-radius:4px;
    background:#fafaf8;font-size:14px;line-height:1.5}
  .row input[type=text]:focus,.row textarea:focus,.row select:focus{
    outline:none;border-color:var(--moss);background:#fff}
  .row textarea{resize:vertical;min-height:70px;font-family:inherit}

  .repeater{display:flex;flex-direction:column;gap:10px}
  .repeater .item{display:grid;grid-template-columns:auto 1fr auto;
    gap:10px;align-items:start;background:#fafaf8;padding:10px 12px;
    border:1px solid var(--line2);border-radius:4px}
  .repeater .item .drag{color:#aaa;cursor:grab;padding-top:8px;user-select:none}
  .repeater .item .drag:active{cursor:grabbing}
  .repeater .item .body{display:flex;flex-direction:column;gap:8px;min-width:0}
  .repeater .item input,.repeater .item textarea{width:100%;
    border:1px solid var(--line);padding:8px 10px;border-radius:4px;
    background:#fff;font-size:13px}
  .repeater .item textarea{min-height:60px;resize:vertical}
  .repeater .item .ctrls{display:flex;gap:4px;flex-direction:column}
  .repeater .item .ctrls button{background:#fff;border:1px solid var(--line);
    width:30px;height:30px;border-radius:4px;cursor:pointer;color:var(--muted);
    font-size:14px;line-height:1}
  .repeater .item .ctrls button:hover{border-color:var(--moss-deep);color:var(--moss-deep)}
  .repeater .item .ctrls button.del:hover{border-color:var(--err);color:var(--err)}
  .repeater .add{align-self:flex-start;background:transparent;
    border:1px dashed var(--line);padding:9px 16px;border-radius:4px;cursor:pointer;
    color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .repeater .add:hover{border-color:var(--moss-deep);border-style:solid;color:var(--moss-deep)}

  /* Gallery rows (specialized) */
  .photo-row{display:grid;grid-template-columns:88px 1fr 180px 80px 70px;
    gap:14px;align-items:start;background:#fafaf8;padding:10px;
    border:1px solid var(--line2);border-radius:4px}
  .photo-row img{width:88px;height:66px;object-fit:cover;border-radius:3px;background:#eee}
  .photo-row .file{font-size:11px;color:#999;margin-bottom:4px}
  .photo-row textarea{width:100%;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:4px;background:#fff;min-height:50px;resize:vertical}
  .photo-row select{width:100%;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:4px;background:#fff}
  .photo-row .show-tg{font-size:11px;padding:6px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fff;color:var(--muted);cursor:pointer;text-align:center}
  .photo-row .show-tg.on{background:var(--moss-deep);color:#fff;border-color:var(--moss-deep)}
  .photo-row .order{display:flex;flex-direction:column;gap:4px}
  .photo-row .order button{width:30px;height:24px;border:1px solid var(--line);
    background:#fff;border-radius:3px;cursor:pointer;color:var(--muted)}
  .photo-row .order button:hover{border-color:var(--moss-deep);color:var(--moss-deep)}

  /* Stats */
  .statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;margin-bottom:24px}
  .statcard{background:var(--paper);border:1px solid var(--line2);
    border-radius:6px;padding:22px}
  .statcard .label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px}
  .statcard .num{font-family:var(--serif);font-size:38px;font-weight:300;
    color:var(--ink);line-height:1}
  .statcard .sub{font-size:12px;color:var(--muted);margin-top:6px}
  .chart{background:var(--paper);border:1px solid var(--line2);border-radius:6px;
    padding:22px}
  .chart h3{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:18px}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .bar-row{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;
    gap:10px;padding:3px 0;font-size:12px}
  .bar-row .date{color:var(--muted)}
  .bar-row .bar{height:18px;background:#eaeae3;border-radius:3px;overflow:hidden;position:relative}
  .bar-row .bar .fill{position:absolute;inset:0;background:var(--moss);
    transform-origin:left;border-radius:3px}
  .bar-row .num{text-align:right;color:var(--ink)}

  /* Loading */
  .loading{padding:40px;text-align:center;color:var(--muted);font-style:italic}

  /* Responsive */
  @media (max-width:760px){
    .row{grid-template-columns:1fr;gap:8px}
    .row label{padding-top:0}
    main.work{padding:18px}
    .savebar{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
    .chart-grid{grid-template-columns:1fr}
    .photo-row{grid-template-columns:64px 1fr;gap:10px}
    .photo-row img{width:64px;height:48px}
    .photo-row select,.photo-row .show-tg,.photo-row .order{grid-column:2}
    .photo-row .order{flex-direction:row}
    header.top{padding:12px 18px;flex-wrap:wrap;gap:10px}
    nav.tabs{padding:0 18px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h1>Preikestolen <em>Villa</em></h1>
    <p class="sub">Admin</p>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" autofocus required>
      <button type="submit">Enter</button>
    </form>
    <div class="err" id="loginErr"></div>
    <a href="/" class="login-back">← Back to site</a>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header class="top">
    <div class="brand">Preikestolen <strong>Villa</strong> · Admin</div>
    <div class="right">
      <a class="view" href="/" target="_blank">View site ↗</a>
      <button class="logout" id="logoutBtn">Log out</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="villa" class="active">Villa page</button>
    <button data-tab="gallery">Gallery photos</button>
    <button data-tab="guidebook">Guidebook</button>
    <button data-tab="stats">Statistics</button>
  </nav>

  <main class="work">
    <div class="pane show" id="pane-villa"><div class="loading">Loading…</div></div>
    <div class="pane" id="pane-gallery"><div class="loading">Loading…</div></div>
    <div class="pane" id="pane-guidebook"><div class="loading">Loading…</div></div>
    <div class="pane" id="pane-stats"><div class="loading">Loading…</div></div>

    <div class="savebar" id="savebar" style="display:none">
      <div class="status" id="status">All changes saved</div>
      <div class="actions">
        <button class="revert" id="revertBtn">Revert</button>
        <button class="save" id="saveBtn" disabled>Save changes</button>
      </div>
    </div>
  </main>
</div>

<script>
// ═════════════════════════════════════════════════════════════════
// Admin client
// ═════════════════════════════════════════════════════════════════

// State
var token = null;
var villaData = null, villaOrig = null;
var guidebookData = null, guidebookOrig = null;
var imageList = { bilder: [], guidebook: [] };
var activeTab = "villa";
var dirty = false;

// ─── DOM helpers ──────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k === "class") e.className = attrs[k];
    else if(k === "style") e.style.cssText = attrs[k];
    else if(k.startsWith("on")) e[k] = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  if(children){
    (Array.isArray(children) ? children : [children]).forEach(function(c){
      if(c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  return e;
}
function esc(s){ return String(s==null?"":s); }

// ─── API ──────────────────────────────────────────────────────────
function api(path, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers["Content-Type"] = "application/json";
  if(token) opts.headers["Authorization"] = "Bearer " + token;
  opts.credentials = "same-origin";
  return fetch(path, opts).then(function(r){
    if(r.status === 401){
      // Token expired or missing — back to login
      sessionStorage.removeItem("pv_admin_token");
      token = null;
      showLogin();
      throw new Error("Unauthorized");
    }
    return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
      return j;
    });
  });
}

// ─── Login ────────────────────────────────────────────────────────
function showLogin(){ $("login").style.display = "grid"; $("app").classList.remove("show"); }
function showApp(){ $("login").style.display = "none"; $("app").classList.add("show"); }

$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  $("loginErr").textContent = "";
  var pw = $("pw").value;
  fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw }),
    credentials: "same-origin"
  }).then(function(r){ return r.json().then(function(j){ return [r, j]; }); })
    .then(function(pair){
      var r = pair[0], j = pair[1];
      if(r.ok && j.ok && j.token){
        token = j.token;
        sessionStorage.setItem("pv_admin_token", token);
        $("pw").value = "";
        showApp();
        boot();
      } else {
        $("loginErr").textContent = j.error || "Wrong password";
      }
    })
    .catch(function(){ $("loginErr").textContent = "Network error"; });
});

$("logoutBtn").addEventListener("click", function(){
  if(dirty && !confirm("You have unsaved changes. Log out anyway?")) return;
  sessionStorage.removeItem("pv_admin_token");
  token = null;
  dirty = false;
  villaData = villaOrig = guidebookData = guidebookOrig = null;
  showLogin();
});

// ─── Tabs ─────────────────────────────────────────────────────────
document.querySelectorAll("nav.tabs button").forEach(function(b){
  b.onclick = function(){
    if(b.dataset.tab === activeTab) return;
    document.querySelectorAll("nav.tabs button").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    document.querySelectorAll(".pane").forEach(function(p){ p.classList.remove("show"); });
    $("pane-"+b.dataset.tab).classList.add("show");
    activeTab = b.dataset.tab;
    if(activeTab === "stats") loadStats();
  };
});

// ─── Dirty / save ─────────────────────────────────────────────────
function setDirty(d){
  dirty = d;
  $("savebar").style.display = d ? "flex" : "none";
  $("saveBtn").disabled = !d;
  $("status").className = "status" + (d ? " dirty" : "");
  $("status").textContent = d ? "Unsaved changes" : "All changes saved";
}

window.addEventListener("beforeunload", function(e){
  if(dirty){ e.preventDefault(); e.returnValue = ""; }
});

$("saveBtn").addEventListener("click", function(){
  $("status").textContent = "Saving…";
  $("status").className = "status";
  $("saveBtn").disabled = true;
  Promise.all([
    JSON.stringify(villaData) !== JSON.stringify(villaOrig)
      ? api("/api/data?page=villa", { method: "POST", body: JSON.stringify({ data: villaData }) })
      : Promise.resolve(),
    JSON.stringify(guidebookData) !== JSON.stringify(guidebookOrig)
      ? api("/api/data?page=guidebook", { method: "POST", body: JSON.stringify({ data: guidebookData }) })
      : Promise.resolve(),
  ]).then(function(){
    villaOrig = JSON.parse(JSON.stringify(villaData));
    guidebookOrig = JSON.parse(JSON.stringify(guidebookData));
    setDirty(false);
    $("status").className = "status ok";
    $("status").textContent = "Saved · live on site";
    setTimeout(function(){ if(!dirty){ $("status").className="status"; $("status").textContent="All changes saved"; }}, 3000);
  }).catch(function(e){
    $("status").className = "status err";
    $("status").textContent = "Save failed: " + e.message;
    $("saveBtn").disabled = false;
  });
});

$("revertBtn").addEventListener("click", function(){
  if(!confirm("Discard all unsaved changes?")) return;
  villaData = JSON.parse(JSON.stringify(villaOrig));
  guidebookData = JSON.parse(JSON.stringify(guidebookOrig));
  setDirty(false);
  renderVilla(); renderGallery(); renderGuidebook();
});

// ─── Boot ─────────────────────────────────────────────────────────
function boot(){
  Promise.all([
    api("/api/data?page=villa"),
    api("/api/data?page=guidebook"),
    fetch("/api/images?folder=bilder").then(function(r){ return r.json(); }).catch(function(){ return { ok:false }; }),
    fetch("/api/images?folder=villa-guide-9k2m7p").then(function(r){ return r.json(); }).catch(function(){ return { ok:false }; })
  ]).then(function(rs){
    villaData = rs[0].data; villaOrig = JSON.parse(JSON.stringify(villaData));
    guidebookData = rs[1].data; guidebookOrig = JSON.parse(JSON.stringify(guidebookData));
    imageList.bilder = (rs[2].ok && rs[2].items) ? rs[2].items : [];
    imageList.guidebook = (rs[3].ok && rs[3].items) ? rs[3].items : [];
    renderVilla(); renderGallery(); renderGuidebook();
  }).catch(function(e){
    console.error(e);
    document.querySelectorAll(".pane.show").forEach(function(p){
      p.innerHTML = "<div class='loading'>Could not load data: "+esc(e.message)+"</div>";
    });
  });
}

// ─── Setters that mark dirty ─────────────────────────────────────
function bindInput(node, getValue, setValue){
  node.addEventListener("input", function(){
    setValue(node.value);
    setDirty(true);
  });
}
function textRow(label, hint, value, onChange){
  var input = el("input", { type: "text", value: value || "" });
  bindInput(input, function(){ return input.value; }, onChange);
  return el("div", { class: "row" }, [
    el("label", null, [label, hint ? el("small", null, hint) : null]),
    input
  ]);
}
function textareaRow(label, hint, value, onChange){
  var input = el("textarea", null, value || "");
  bindInput(input, function(){ return input.value; }, onChange);
  return el("div", { class: "row" }, [
    el("label", null, [label, hint ? el("small", null, hint) : null]),
    input
  ]);
}
function selectRow(label, hint, value, options, onChange){
  var sel = el("select", null, options.map(function(o){
    return el("option", { value: o.value, selected: o.value===value ? "selected" : undefined }, o.label);
  }));
  sel.addEventListener("change", function(){ onChange(sel.value); setDirty(true); });
  return el("div", { class: "row" }, [
    el("label", null, [label, hint ? el("small", null, hint) : null]),
    sel
  ]);
}
function imagePicker(label, hint, value, folder, onChange){
  var imgs = imageList[folder] || [];
  var opts = [{ value: "", label: "— select image —" }].concat(
    imgs.map(function(i){ return { value: i.fullName, label: i.fullName }; })
  );
  // If current value is not in list, add it so it stays selectable
  if(value && !imgs.some(function(i){ return i.fullName === value; })){
    opts.push({ value: value, label: value + " (file not found)" });
  }
  return selectRow(label, hint, value, opts, onChange);
}

// ─── Repeater for arrays ─────────────────────────────────────────
function repeater(arr, makeFields, makeEmpty, onChange){
  var wrap = el("div", { class: "repeater" });
  function rebuild(){
    wrap.innerHTML = "";
    arr.forEach(function(item, i){
      var body = el("div", { class: "body" });
      makeFields(item, body, function(){ onChange(); });
      var up = el("button", { onclick: function(){
        if(i===0) return;
        var t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t;
        onChange(); rebuild();
      }}, "▲");
      var dn = el("button", { onclick: function(){
        if(i===arr.length-1) return;
        var t = arr[i+1]; arr[i+1] = arr[i]; arr[i] = t;
        onChange(); rebuild();
      }}, "▼");
      var del = el("button", { class: "del", onclick: function(){
        if(!confirm("Remove this item?")) return;
        arr.splice(i,1); onChange(); rebuild();
      }}, "✕");
      var row = el("div", { class: "item" }, [
        el("div", { class: "drag" }, "≡"),
        body,
        el("div", { class: "ctrls" }, [up, dn, del])
      ]);
      wrap.appendChild(row);
    });
    var add = el("button", { class: "add", onclick: function(){
      arr.push(makeEmpty()); onChange(); rebuild();
    }}, "+ Add item");
    wrap.appendChild(add);
  }
  rebuild();
  return wrap;
}

// ─── GALLERY PANE ─────────────────────────────────────────────────
function renderGallery(){
  var pane = $("pane-gallery");
  pane.innerHTML = "";
  if(!villaData) return;
  villaData.galleryPhotos = villaData.galleryPhotos || [];
  villaData.galleryRooms = villaData.galleryRooms || [];

  var top = el("div", { class: "section" }, [
    el("h2", null, "Gallery photos"),
    el("p", { class: "help" },
      "Drag-and-drop order with ▲ / ▼ buttons. Set room type and description. Toggle Show/Hide to publish or temporarily hide a photo. " +
      "To add new photos: upload the .jpg file (and an optional thumbnail named foo-t.jpg) to the bilder/ folder on GitHub, then click '+ Refresh from folder'."
    )
  ]);

  // Room types editor
  var roomsBox = el("div", { class: "section" }, [
    el("h2", null, "Room categories"),
    el("p", { class: "help" }, "The filter buttons shown above the gallery grid. Order matters. Leave empty if a category isn't used by any photo."),
  ]);
  var roomsArea = el("textarea", null, villaData.galleryRooms.join("\n"));
  roomsArea.style.cssText = "width:100%;min-height:120px;border:1px solid var(--line);padding:10px;border-radius:4px;background:#fafaf8;font-family:inherit;font-size:13px";
  roomsArea.oninput = function(){
    villaData.galleryRooms = roomsArea.value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
    setDirty(true);
  };
  roomsBox.appendChild(roomsArea);

  // Photos
  var photosBox = el("div", { class: "section" }, [
    el("h2", null, "Photos"),
  ]);

  // Refresh button (re-fetches image list from bilder/)
  var refreshBtn = el("button", {
    class: "add", style: "margin-bottom:14px",
    onclick: function(){
      refreshBtn.textContent = "Loading…";
      fetch("/api/images?folder=bilder").then(function(r){ return r.json(); })
        .then(function(j){
          if(j.ok){
            imageList.bilder = j.items;
            // Find photos in the folder that aren't in galleryPhotos yet
            var existing = new Set(villaData.galleryPhotos.map(function(p){ return p.file; }));
            var added = 0;
            j.items.forEach(function(it){
              if(!existing.has(it.file)){
                villaData.galleryPhotos.push({
                  file: it.file,
                  ext: it.ext,
                  room: villaData.galleryRooms[0] || "",
                  tall: false,
                  show: true,
                  desc: ""
                });
                added++;
              }
            });
            renderGallery();
            setDirty(true);
            refreshBtn.textContent = added > 0
              ? "+ Refresh from folder ("+added+" new photo"+(added===1?"":"s")+" added)"
              : "+ Refresh from folder (no new files found)";
            setTimeout(function(){ refreshBtn.textContent = "+ Refresh from folder"; }, 4000);
          }
        });
    }
  }, "+ Refresh from folder");
  photosBox.appendChild(refreshBtn);

  villaData.galleryPhotos.forEach(function(p, i){
    var row = el("div", { class: "photo-row" });
    var img = el("img", { src: "/bilder/" + encodeURIComponent(p.file + "-t") + "." + (p.ext||"jpg") });
    img.onerror = function(){ img.src = "/bilder/" + encodeURIComponent(p.file) + "." + (p.ext||"jpg"); };
    row.appendChild(img);

    var mid = el("div", null, [
      el("div", { class: "file" }, p.file + "." + (p.ext||"jpg")),
    ]);
    var ta = el("textarea", { placeholder: "Description (shown to guests)" }, p.desc || "");
    ta.oninput = function(){ p.desc = ta.value; setDirty(true); };
    mid.appendChild(ta);
    row.appendChild(mid);

    // Room select
    var rs = villaData.galleryRooms.slice();
    if(p.room && rs.indexOf(p.room) < 0) rs.push(p.room);
    var sel = el("select", null, rs.map(function(r){
      return el("option", { value: r, selected: r===p.room ? "selected" : undefined }, r);
    }).concat([el("option", { value: "__new__" }, "+ New room type…")]));
    sel.onchange = function(){
      if(sel.value === "__new__"){
        var n = prompt("New room type name:");
        if(n && (n = n.trim())){
          if(villaData.galleryRooms.indexOf(n) < 0) villaData.galleryRooms.push(n);
          p.room = n;
        }
        renderGallery(); setDirty(true);
      } else {
        p.room = sel.value; setDirty(true);
      }
    };
    row.appendChild(sel);

    // Show toggle
    var sh = el("div", { class: "show-tg" + (p.show!==false ? " on" : "") }, p.show!==false ? "On" : "Off");
    sh.onclick = function(){
      p.show = p.show === false;
      sh.className = "show-tg" + (p.show!==false ? " on" : "");
      sh.textContent = p.show!==false ? "On" : "Off";
      setDirty(true);
    };
    row.appendChild(sh);

    // Order
    var up = el("button", { onclick: function(){
      if(i===0) return;
      var t = villaData.galleryPhotos[i-1];
      villaData.galleryPhotos[i-1] = p;
      villaData.galleryPhotos[i] = t;
      renderGallery(); setDirty(true);
    }}, "▲");
    var dn = el("button", { onclick: function(){
      if(i===villaData.galleryPhotos.length-1) return;
      var t = villaData.galleryPhotos[i+1];
      villaData.galleryPhotos[i+1] = p;
      villaData.galleryPhotos[i] = t;
      renderGallery(); setDirty(true);
    }}, "▼");
    var del = el("button", { onclick: function(){
      if(!confirm("Remove this photo from the gallery? (The file remains in bilder/, you can re-add later.)")) return;
      villaData.galleryPhotos.splice(i,1); renderGallery(); setDirty(true);
    }}, "✕");
    row.appendChild(el("div", { class: "order" }, [up, dn, del]));

    photosBox.appendChild(row);
  });

  pane.appendChild(top);
  pane.appendChild(roomsBox);
  pane.appendChild(photosBox);
}

  areaS.appendChild(langRow("Section heading", d.area, "heading"));
  areaS.appendChild(langRow("Intro", d.area, "intro", true));
  areaS.appendChild(el("label", { style: "display:block;margin:18px 0 8px;font-size:13px;color:var(--muted);font-weight:500" }, "Trips & sights"));
  d.area.trips = d.area.trips || [];
  areaS.appendChild(repeater(d.area.trips,
    function(trip, body, onChange){
      // Title
      ["title", "text"].forEach(function(field){
        trip[field] = trip[field] || { en: "", no: "", de: "" };
      });
      var imgPick;
      var imgs = imageList.guidebook || [];
      var opts = [{ value: "", label: "— select image —" }].concat(
        imgs.map(function(i){ return { value: i.fullName, label: i.fullName }; })
      );
      if(trip.image && !imgs.some(function(i){ return i.fullName === trip.image; })){
        opts.push({ value: trip.image, label: trip.image + " (file not found)" });
      }
      imgPick = el("select", null, opts.map(function(o){
        return el("option", { value: o.value, selected: o.value===trip.image ? "selected" : undefined }, o.label);
      }));
      imgPick.onchange = function(){ trip.image = imgPick.value; onChange(); };
      body.appendChild(el("div", { style: "display:flex;gap:8px;align-items:center;font-size:12px" }, [
        el("span", { style: "color:#999;width:60px" }, "Image:"), imgPick
      ]));
      ["en","no","de"].forEach(function(lng){
        var t = el("input", { type: "text", placeholder: "Title ("+lng.toUpperCase()+")", value: trip.title[lng] || "" });
        t.oninput = function(){ trip.title[lng] = t.value; onChange(); };
        body.appendChild(t);
        var x = el("textarea", { placeholder: "Body ("+lng.toUpperCase()+")" }, trip.text[lng] || "");
        x.oninput = function(){ trip.text[lng] = x.value; onChange(); };
        body.appendChild(x);
      });
      var url = el("input", { type: "text", placeholder: "Google Maps URL", value: trip.mapUrl || "" });
      url.oninput = function(){ trip.mapUrl = url.value; onChange(); };
      body.appendChild(url);
    },
    function(){ return { image: "", title: { en:"",no:"",de:"" }, text: { en:"",no:"",de:"" }, mapUrl: "" }; },
    function(){ setDirty(true); }
  ));
  pane.appendChild(areaS);

  // Manuals (if exists in data)
  if(Array.isArray(d.manuals)){
    var manualsS = el("div", { class: "section" }, [
      el("h2", null, "Manuals & instructions"),
      el("p", { class: "help" }, "How-tos for the house (sauna, hot tub, etc.)")
    ]);
    manualsS.appendChild(repeater(d.manuals,
      function(man, body, onChange){
        ["title", "text"].forEach(function(f){ man[f] = man[f] || { en:"",no:"",de:"" }; });
        ["en","no","de"].forEach(function(lng){
          var t = el("input", { type: "text", placeholder: "Title ("+lng.toUpperCase()+")", value: man.title[lng] || "" });
          t.oninput = function(){ man.title[lng] = t.value; onChange(); };
          body.appendChild(t);
          var x = el("textarea", { placeholder: "Instructions ("+lng.toUpperCase()+")" }, man.text[lng] || "");
          x.oninput = function(){ man.text[lng] = x.value; onChange(); };
          body.appendChild(x);
        });
        var v = el("input", { type: "text", placeholder: "Video URL (YouTube/Vimeo — optional)", value: man.video || "" });
        v.oninput = function(){ man.video = v.value; onChange(); };
        body.appendChild(v);
      },
      function(){ return { title:{en:"",no:"",de:""}, text:{en:"",no:"",de:""}, video:"" }; },
      function(){ setDirty(true); }
    ));
    pane.appendChild(manualsS);
  }
}

// ─── STATS PANE ───────────────────────────────────────────────────
function loadStats(){
  var pane = $("pane-stats");
  pane.innerHTML = "<div class='loading'>Loading…</div>";
  api("/api/stats").then(function(s){ renderStats(s); }).catch(function(e){
    pane.innerHTML = "<div class='loading'>Could not load stats: "+esc(e.message)+"</div>";
  });
}

function renderStats(s){
  var pane = $("pane-stats");
  pane.innerHTML = "";

  var cards = el("div", { class: "statcards" }, [
    el("div", { class: "statcard" }, [
      el("div", { class: "label" }, "Villa — total views"),
      el("div", { class: "num" }, String(s.villa.total)),
      el("div", { class: "sub" }, s.villa.updatedAt ? "Last update: " + new Date(s.villa.updatedAt).toLocaleString() : "—")
    ]),
    el("div", { class: "statcard" }, [
      el("div", { class: "label" }, "Villa — last 7 days"),
      el("div", { class: "num" }, String(s.villa.last7)),
      el("div", { class: "sub" }, s.villa.last30 + " views in last 30 days")
    ]),
    el("div", { class: "statcard" }, [
      el("div", { class: "label" }, "Guidebook — total"),
      el("div", { class: "num" }, String(s.guidebook.total)),
      el("div", { class: "sub" }, s.guidebook.updatedAt ? "Last update: " + new Date(s.guidebook.updatedAt).toLocaleString() : "—")
    ]),
    el("div", { class: "statcard" }, [
      el("div", { class: "label" }, "Guidebook — last 7 days"),
      el("div", { class: "num" }, String(s.guidebook.last7)),
      el("div", { class: "sub" }, s.guidebook.last30 + " views in last 30 days")
    ])
  ]);
  pane.appendChild(cards);

  function chart(title, daily){
    var max = Math.max.apply(null, daily.map(function(d){ return d.count; })) || 1;
    var rows = daily.slice(0,14).reverse().map(function(d){
      var pct = d.count / max;
      var bar = el("div", { class: "bar" }, [
        el("div", { class: "fill", style: "transform:scaleX("+pct+")" })
      ]);
      return el("div", { class: "bar-row" }, [
        el("div", { class: "date" }, d.date.slice(5)),
        bar,
        el("div", { class: "num" }, String(d.count))
      ]);
    });
    return el("div", { class: "chart" }, [
      el("h3", null, title),
      el("div", null, rows)
    ]);
  }
  pane.appendChild(el("div", { class: "chart-grid" }, [
    chart("Villa — daily views (last 14 days)", s.villa.daily),
    chart("Guidebook — daily views (last 14 days)", s.guidebook.daily)
  ]));

  pane.appendChild(el("p", { style: "margin-top:24px;font-size:12px;color:var(--muted);text-align:center" },
    "For richer analytics (countries, referrers, devices), enable Vercel Web Analytics in the Vercel dashboard."));
}

// ─── Boot ─────────────────────────────────────────────────────────
var saved = sessionStorage.getItem("pv_admin_token");
if(saved){
  token = saved;
  // Validate by calling a quick endpoint
  api("/api/stats").then(function(){
    showApp(); boot();
  }).catch(function(){
    // Token invalid - back to login
    showLogin();
  });
} else {
  showLogin();
}
</script>
