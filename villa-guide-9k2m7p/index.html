<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Villaen i Alsvik — Guidebook</title>
<meta name="description" content="Guest guidebook." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --stone-900:#1c1f1d;--stone-800:#2b302c;--stone-700:#3d433d;
    --moss:#5b6b54;--moss-deep:#404c3c;--fog:#d7d9d2;
    --linen:#ece9e1;--linen-warm:#f4f1e8;--paper:#faf8f2;
    --rust:#a8623c;--gold:#c9a25a;--muted:#6f746b;
    --serif:"Fraunces",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
    --maxw:1200px;--ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--stone-900);font-family:var(--sans);
    font-weight:300;font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--moss);color:var(--paper)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.12;letter-spacing:-.01em}
  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 28px}
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--moss)}
  .hidden{display:none!important}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  .site-header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:24px 40px;transition:all .5s var(--ease);
    mix-blend-mode:difference;color:#fff}
  .site-header.scrolled{mix-blend-mode:normal;color:var(--stone-900);
    background:rgba(250,248,242,.85);backdrop-filter:blur(14px);padding:16px 40px;
    border-bottom:1px solid rgba(0,0,0,.06)}
  .brand{font-family:var(--serif);font-size:20px;letter-spacing:.02em;cursor:pointer}
  .brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;opacity:.7;margin-top:3px}
  .header-right{display:flex;align-items:center;gap:30px}
  .nav{display:flex;gap:34px;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
  .nav a{position:relative;padding-bottom:3px;cursor:pointer}
  .nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;
    background:currentColor;transition:width .4s var(--ease)}
  .nav a:hover::after{width:100%}
  .lang{display:flex;gap:4px;font-size:12px;letter-spacing:.1em}
  .lang button{background:none;border:none;color:inherit;cursor:pointer;font-family:var(--sans);
    padding:4px 7px;opacity:.55;text-transform:uppercase;letter-spacing:.12em;font-size:12px;
    transition:opacity .3s;border-radius:2px}
  .lang button.active{opacity:1;font-weight:500;border:1px solid currentColor}
  .lang button:hover{opacity:.9}

  .hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;overflow:hidden;color:#fff}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;
    transform:scale(1.08);animation:zoom 22s ease-out forwards}
  @keyframes zoom{to{transform:scale(1)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,
    rgba(20,24,20,.32)0%,rgba(20,24,20,.1)38%,rgba(20,24,20,.78)100%)}
  .hero-inner{position:relative;z-index:2;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 40px 88px}
  .hero h1{font-size:clamp(3rem,8.5vw,7.4rem);font-weight:300;max-width:14ch;
    text-shadow:0 2px 30px rgba(0,0,0,.3)}
  .hero .lede{margin-top:26px;max-width:46ch;font-size:19px;opacity:.94}
  .hero-meta{margin-top:40px;display:flex;gap:40px;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;opacity:.9;flex-wrap:wrap}
  .hero-meta span{border-left:1px solid rgba(255,255,255,.4);padding-left:16px}
  .scrollcue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:3;
    width:1px;height:54px;background:rgba(255,255,255,.6);overflow:hidden}
  .scrollcue::after{content:"";position:absolute;inset:0;background:#fff;
    animation:cue 2.4s var(--ease) infinite}
  @keyframes cue{0%{transform:translateY(-100%)}60%,100%{transform:translateY(100%)}}

  section{position:relative}
  .section-pad{padding:130px 0}
  .section-head{max-width:760px;margin-bottom:70px}
  .section-head h2{font-size:clamp(2.1rem,4.6vw,3.6rem);margin-top:18px}
  .section-head p{margin-top:22px;color:var(--muted);font-size:18px;max-width:58ch}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:90px;align-items:center}
  .split-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--fog)}
  .split-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
  .split-media:hover img{transform:scale(1.05)}
  .frame-tag{position:absolute;left:22px;bottom:22px;color:#fff;font-size:12px;
    letter-spacing:.24em;text-transform:uppercase;text-shadow:0 1px 12px rgba(0,0,0,.5)}
  .split-text h2{font-size:clamp(2rem,4vw,3.1rem)}
  .split-text p{margin-top:24px;color:var(--muted);font-size:18px}
  .facts{margin-top:40px;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.08)}
  .fact{background:var(--paper);padding:22px 24px}
  .fact .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--moss)}
  .fact .v{font-family:var(--serif);font-size:21px;margin-top:6px}

  .guide-band{background:var(--stone-900);color:var(--linen)}
  .guide-band .eyebrow{color:var(--gold)}
  .guide-band .section-head p{color:rgba(236,233,225,.7)}
  .guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
  .guide-card{background:var(--stone-900);padding:46px 40px;min-height:260px;display:flex;
    flex-direction:column;justify-content:space-between;transition:background .5s var(--ease);cursor:pointer}
  .guide-card:hover{background:var(--moss-deep)}
  .guide-card svg{width:30px;height:30px;stroke:var(--gold);stroke-width:1.4;fill:none}
  .guide-card h3{font-size:1.7rem;margin-top:30px}
  .guide-card p{margin-top:14px;font-size:15px;color:rgba(236,233,225,.66)}
  .gc-go{margin-top:28px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold);display:flex;align-items:center;gap:10px}
  .gc-go::after{content:"→";transition:transform .4s var(--ease)}
  .guide-card:hover .gc-go::after{transform:translateX(8px)}

  .trips{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:20px}
  .trip{background:var(--paper);border:1px solid rgba(0,0,0,.08);overflow:hidden;
    display:flex;flex-direction:column}
  .trip-img{aspect-ratio:3/2;background:var(--fog);overflow:hidden}
  .trip-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
  .trip:hover .trip-img img{transform:scale(1.05)}
  .trip-body{padding:28px;display:flex;flex-direction:column;flex:1}
  .trip-body h3{font-size:1.4rem}
  .trip-body p{margin-top:12px;color:var(--muted);font-size:15px;flex:1}
  .trip-map{margin-top:18px;display:inline-flex;align-items:center;gap:10px;
    padding:10px 14px;background:rgba(91,107,84,.07);border:1px solid rgba(91,107,84,.18);
    border-radius:3px;text-decoration:none;color:var(--moss-deep);
    transition:background .2s, border-color .2s;max-width:100%}
  .trip-map:hover{background:rgba(91,107,84,.13);border-color:rgba(91,107,84,.35)}
  .trip-map .pin{flex:0 0 16px;width:16px;height:16px;color:var(--moss)}
  .trip-map .pin svg{width:100%;height:100%;display:block}
  .trip-map .label{font-size:14px;font-weight:500;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24ch}
  .trip-map .cta{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--moss);padding-left:8px;border-left:1px solid rgba(91,107,84,.25);margin-left:4px}

  .manual-page{padding:140px 0 130px;display:none}
  .manual-page.active{display:block}
  .back-link{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--moss);
    display:inline-flex;gap:10px;margin-bottom:50px;cursor:pointer;background:none;border:none;
    font-family:var(--sans)}
  .manual-page h1{font-size:clamp(2.4rem,6vw,4.4rem);max-width:16ch}
  .manual-page .lede{margin-top:22px;color:var(--muted);font-size:19px;max-width:54ch}
  .manual-body{margin-top:70px;max-width:760px}
  .m-section{padding:44px 0;border-top:1px solid rgba(0,0,0,.1)}
  .m-section:first-child{border-top:none;padding-top:0}
  .m-section h3{font-size:1.7rem;margin-bottom:20px}
  .m-section p{color:var(--stone-700);font-size:18px;white-space:pre-line}
  .m-video{margin:26px 0 6px;width:100%;aspect-ratio:16/9;background:var(--stone-900);
    border-radius:2px;overflow:hidden}
  .m-video iframe,.m-video video{width:100%;height:100%;border:0;object-fit:cover}
  .m-video-thumb{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:filter .2s}
  .m-video-thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);
    transition:background .2s}
  .m-video-thumb:hover::after,.m-video-thumb:focus::after{background:rgba(0,0,0,.08)}
  .m-video-thumb:focus{outline:2px solid var(--linen);outline-offset:-4px}
  .m-play{position:relative;z-index:1;display:grid;place-items:center;width:72px;height:72px;
    border-radius:50%;background:rgba(255,255,255,.94);color:var(--stone-900);
    box-shadow:0 6px 24px rgba(0,0,0,.35);
    transition:transform .2s, background .2s}
  .m-video-thumb:hover .m-play{transform:scale(1.06);background:#fff}
  .m-play svg{margin-left:4px} /* nudge play icon visually centered */
  .m-check{list-style:none;margin-top:8px}
  .m-check li{padding:16px 0 16px 38px;position:relative;
    border-bottom:1px solid rgba(0,0,0,.08);font-size:17px}
  .m-check li::before{content:"";position:absolute;left:0;top:19px;width:18px;height:18px;
    border:1.5px solid var(--moss);border-radius:50%}
  .m-check li::after{content:"";position:absolute;left:6px;top:23px;width:7px;height:4px;
    border-left:1.5px solid var(--moss);border-bottom:1.5px solid var(--moss);transform:rotate(-45deg)}

  .contact{background:var(--linen-warm)}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
  .contact h2{font-size:clamp(2.2rem,5vw,3.8rem)}
  .contact p{margin-top:22px;color:var(--muted);font-size:18px}
  .contact-card{background:var(--paper);border:1px solid rgba(0,0,0,.08);padding:50px;
    font-family:var(--serif);font-size:21px;line-height:1.5}
  .contact-card .small{font-family:var(--sans);font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--moss);margin-bottom:18px}

  footer{background:var(--stone-900);color:rgba(236,233,225,.7);padding:60px 0;font-size:14px}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
  footer .brand{color:var(--linen)}
  .admin-link{letter-spacing:.16em;text-transform:uppercase;font-size:12px;cursor:pointer;
    background:none;border:none;color:rgba(236,233,225,.7);font-family:var(--sans)}

  .admin-overlay{position:fixed;inset:0;z-index:100;background:var(--linen);overflow-y:auto;display:none}
  .admin-overlay.active{display:block}
  .admin-top{display:flex;justify-content:space-between;align-items:center;padding:20px 32px;
    background:var(--paper);border-bottom:1px solid rgba(0,0,0,.1);position:sticky;top:0;z-index:10;
    flex-wrap:wrap;gap:12px}
  .admin-main{max-width:1000px;margin:0 auto;padding:40px 32px 120px}
  .admin-login{min-height:100vh;display:grid;place-items:center;background:var(--stone-900);
    color:var(--linen);padding:24px}
  .admin-login .box{width:100%;max-width:380px;text-align:center}
  .admin-login h2{font-size:2rem;margin:16px 0 8px}
  .admin-login p{color:rgba(236,233,225,.6);margin-bottom:30px;font-size:15px}
  .field{margin-bottom:16px;text-align:left}
  .field label{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--moss);margin-bottom:8px}
  .input,.textarea,.select{width:100%;background:var(--paper);border:1px solid rgba(0,0,0,.16);
    color:var(--stone-900);padding:13px 15px;font-family:var(--sans);font-size:16px;
    border-radius:2px;outline:none;transition:border-color .3s}
  .input:focus,.textarea:focus,.select:focus{border-color:var(--moss)}
  .textarea{min-height:110px;resize:vertical;line-height:1.6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--moss);
    color:var(--paper);border:none;padding:14px 28px;font-family:var(--sans);font-size:13px;
    font-weight:500;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border-radius:2px;
    transition:background .3s var(--ease)}
  .btn:hover{background:var(--moss-deep)}
  .btn.ghost{background:transparent;color:var(--stone-900);border:1px solid rgba(0,0,0,.22)}
  .btn.ghost:hover{background:rgba(0,0,0,.05)}
  .btn.danger{background:transparent;color:var(--rust);border:1px solid rgba(168,98,60,.4)}
  .btn.danger:hover{background:rgba(168,98,60,.08)}
  .btn.small{padding:9px 16px;font-size:11px}
  .admin-title{font-family:var(--serif);font-size:1.8rem;margin:46px 0 8px}
  .admin-title:first-child{margin-top:0}
  .admin-hint{color:var(--muted);font-size:15px;margin-bottom:24px}
  .card{background:var(--paper);border:1px solid rgba(0,0,0,.1);border-radius:3px;
    padding:26px;margin-bottom:16px}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:6px}
  .card-head h3{font-size:1.35rem}
  .card-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .lang-tabs{display:flex;gap:6px;margin-bottom:8px}
  .lang-tabs button{background:none;border:1px solid rgba(0,0,0,.2);color:var(--muted);
    padding:5px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
    border-radius:2px;font-family:var(--sans)}
  .lang-tabs button.active{background:var(--moss);color:var(--paper);border-color:var(--moss)}
  .block-ed{border:1px solid rgba(0,0,0,.12);border-radius:3px;padding:18px;margin-bottom:12px;
    background:var(--linen-warm)}
  .block-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .block-type{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--moss)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--stone-900);
    color:var(--linen);padding:14px 26px;border-radius:3px;font-size:14px;z-index:200;
    box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:90vw;text-align:center}
  .save-bar{background:var(--gold);color:var(--stone-900);padding:16px 32px;text-align:center;
    font-size:14px;line-height:1.5}
  .save-bar b{font-weight:500}

  @media(max-width:900px){
    .site-header,.site-header.scrolled{padding:16px 18px}
    .nav{display:none}
    .header-right{gap:14px}
    .hero-inner{padding:0 22px 60px}
    .hero-meta{flex-direction:column;gap:14px}
    .split,.contact-grid{grid-template-columns:1fr;gap:42px}
    .guide-grid,.trips{grid-template-columns:1fr}
    .section-pad{padding:80px 0}
    .wrap{padding:0 20px}
    .grid-2{grid-template-columns:1fr}
    .admin-main,.admin-top{padding-left:18px;padding-right:18px}
  }
</style>
</head>
<body>

<div id="site">
  <header class="site-header" id="hdr">
    <div class="brand" onclick="goHome()">Villaen<small>i Alsvik · Ryfylke</small></div>
    <div class="header-right">
      <nav class="nav">
        <a onclick="goHome();scrollToId('huset')" data-t="nav_house">The house</a>
        <a onclick="goHome();scrollToId('guidebook')" data-t="nav_guide">Guidebook</a>
        <a onclick="goHome();scrollToId('omradet')" data-t="nav_area">The area</a>
        <a onclick="goHome();scrollToId('kontakt')" data-t="nav_contact">Contact</a>
      </nav>
      <div class="lang" id="langSwitch">
        <button data-l="en" onclick="setLang('en')">EN</button>
        <button data-l="no" onclick="setLang('no')">NO</button>
        <button data-l="de" onclick="setLang('de')">DE</button>
      </div>
    </div>
  </header>

  <div id="home">
    <section class="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-inner">
        <div class="eyebrow reveal" id="heroEyebrow" style="color:rgba(255,255,255,.85)"></div>
        <h1 class="reveal" id="heroName">Villaen i Alsvik</h1>
        <p class="lede reveal" id="heroTag"></p>
        <div class="hero-meta reveal" id="heroMeta"></div>
      </div>
      <div class="scrollcue"></div>
    </section>

    <section id="huset" class="section-pad">
      <div class="wrap">
        <div class="split">
          <div class="split-media reveal">
            <img id="houseImg" alt="Villaen i Alsvik" />
            <span class="frame-tag">Villaen — Alsvik</span>
          </div>
          <div class="split-text">
            <div class="eyebrow reveal" data-t="welcome">Welcome</div>
            <h2 class="reveal" id="houseH2" style="margin-top:16px"></h2>
            <p class="reveal" id="introText"></p>
            <div class="facts reveal" id="factsBox"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="guidebook" class="guide-band section-pad">
      <div class="wrap">
        <div class="section-head">
          <div class="eyebrow reveal" data-t="guidebook">Guidebook</div>
          <h2 class="reveal" id="guideH2"></h2>
          <p class="reveal" id="guideP"></p>
        </div>
        <div class="guide-grid" id="guideGrid"></div>
      </div>
    </section>

    <section id="omradet" class="section-pad">
      <div class="wrap">
        <div class="section-head">
          <div class="eyebrow reveal" data-t="area">The area</div>
          <h2 class="reveal" id="areaH2"></h2>
          <p class="reveal" id="areaP"></p>
        </div>
        <div class="trips" id="tripsGrid"></div>
      </div>
    </section>

    <section id="kontakt" class="contact section-pad">
      <div class="wrap">
        <div class="contact-grid">
          <div>
            <div class="eyebrow reveal" data-t="contact">Contact</div>
            <h2 class="reveal" id="contactH2" style="margin-top:16px"></h2>
          </div>
          <div class="contact-card reveal">
            <div class="small" data-t="contact_label">Booking platforms</div>
            <div id="contactBody"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <main class="manual-page" id="manualPage">
    <div class="wrap">
      <button class="back-link" onclick="goHome()" id="backLink">← Back to guidebook</button>
      <div class="eyebrow" data-t="guidebook">Guidebook</div>
      <h1 id="mTitle" style="margin-top:16px"></h1>
      <p class="lede" id="mSummary"></p>
      <div class="manual-body" id="mBody"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="brand">Preikestolen Villa</div>
      <div id="footYear"></div>
      <div style="display:flex;gap:24px;align-items:center">
        <a class="admin-link" href="/admin" style="text-decoration:none">Admin</a>
      </div>
    </div>
  </footer>
</div>

<!-- Old admin overlay removed - admin moved to /admin -->


<div class="toast hidden" id="toast"></div>

<script src="data.js"></script>
<script>
"use strict";

var LANGS=["en","no","de"];
var UI={
  en:{nav_house:"The house",nav_guide:"Guidebook",nav_area:"The area",nav_contact:"Contact",
      welcome:"Welcome",guidebook:"Guidebook",area:"The area",contact:"Contact",
      contact_label:"Booking platforms",back:"← Back to guidebook",
      house_h2:"A house that breathes with the fjord",guide_h2:"Everything you need for a good stay",
      guide_p:"Short, clear guides with text and video — from arrival to departure. Tap a topic to read more.",

// Extract a human-readable place label from a Google Maps URL so we can
// show "Preikestolen" next to the pin instead of a bare "Open in maps".
// Returns "" when the URL is shortened (maps.app.goo.gl) or unparseable.
function parseMapLabel(url){
  if(!url) return "";
  var s = String(url).trim();
  if(!/^https?:\/\//i.test(s)) return "";
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(s)) return ""; // shortened
  // /maps/place/<name>/...
  var pm = s.match(/\/maps\/place\/([^\/?@]+)/i);
  if(pm){
    try { return decodeURIComponent(pm[1]).replace(/\+/g," ").trim(); }
    catch(e){ return pm[1].replace(/\+/g," "); }
  }
  // ?q=<query>
  var qm = s.match(/[?&]q=([^&#]+)/i);
  if(qm){
    var q;
    try { q = decodeURIComponent(qm[1]); } catch(e){ q = qm[1]; }
    q = q.replace(/\+/g," ").trim();
    // Don't show bare coordinates as a label — let the "Open in maps" CTA carry it
    if(/^-?\d+\.\d+\s*,\s*-?\d+\.\d+$/.test(q)) return "";
    return q;
  }
  return "";
}

// Returns a video block as a clickable thumbnail (cheap to render, no
// iframe loaded until the user actually clicks). Clicking swaps the
// thumbnail for the real embed.
function videoHtml(url){
  if(!url) return "";
  var ytId = null, vmId = null, kind = null;
  // YouTube long (?v=), short (youtu.be/), embed, /v/, /shorts/
  var ym = url.match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|v\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_\-]{6,})/);
  if(ym){ ytId = ym[1]; kind = "yt"; }
  if(!ytId){
    var vm = url.match(/vimeo\.com\/(?:video\/)?(\d{4,})/);
    if(vm){ vmId = vm[1]; kind = "vm"; }
  }
  if(!kind){
    // Direct video file or unrecognised — fall back to <video> tag
    return '<div class="m-video"><video src="'+esc(url)+'" controls preload="metadata"></video></div>';
  }
  var thumb = ytId
    ? "https://img.youtube.com/vi/"+encodeURIComponent(ytId)+"/hqdefault.jpg"
    : ""; // Vimeo would need an API call for the real thumb; use solid bg
  var embed = ytId
    ? "https://www.youtube.com/embed/"+encodeURIComponent(ytId)+"?autoplay=1&rel=0"
    : "https://player.vimeo.com/video/"+encodeURIComponent(vmId)+"?autoplay=1";
  var bg = thumb
    ? 'style="background-image:url(\''+thumb+'\');background-size:cover;background-position:center"'
    : 'style="background:#1ab7ea"';
  return '<div class="m-video m-video-thumb" '+bg+' '+
    'data-embed="'+esc(embed)+'" onclick="playVideo(this)" '+
    'role="button" tabindex="0" aria-label="Play video" '+
    'onkeypress="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();playVideo(this);}">'+
    '<span class="m-play" aria-hidden="true">'+
      '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>'+
    '</span></div>';
}

// Swap a video thumbnail for the actual iframe embed when clicked.
function playVideo(node){
  var src = node.getAttribute("data-embed");
  if(!src) return;
  var iframe = document.createElement("iframe");
  iframe.src = src;
  iframe.setAttribute("allow", "accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture");
  iframe.setAttribute("allowfullscreen", "");
  iframe.setAttribute("frameborder", "0");
  // Replace the thumbnail in place — keep the wrapper for layout
  node.innerHTML = "";
  node.classList.remove("m-video-thumb");
  node.removeAttribute("style");
  node.removeAttribute("onclick");
  node.removeAttribute("onkeypress");
  node.removeAttribute("role");
  node.removeAttribute("tabindex");
  node.appendChild(iframe);
}

function openManual(id){
  var list=D.manuals||[], m=null;
  for(var i=0;i<list.length;i++){ if(list[i].id===id){ m=list[i]; break; } }
  if(!m){ goHome(); return; }
  document.getElementById("mTitle").textContent=t(m.title);
  document.getElementById("mSummary").textContent=t(m.summary);
  var html="";
  (m.sections||[]).forEach(function(s){
    html+='<div class="m-section">';
    if(s.heading&&t(s.heading)) html+='<h3>'+esc(t(s.heading))+'</h3>';
    if(s.type==="checklist"){
      var items=s.items||{};
      var arr=Array.isArray(items)?items:(items[LANG]||items.en||items.no||items.de||[]);
      html+='<ul class="m-check">';
      arr.forEach(function(it){ if(it) html+='<li>'+esc(it)+'</li>'; });
      html+='</ul>';
    }else{
      if(s.video) html+=videoHtml(s.video);
      if(t(s.body)) html+='<p>'+esc(t(s.body))+'</p>';
    }
    html+='</div>';
  });
  document.getElementById("mBody").innerHTML=html;
  document.getElementById("manualPage").setAttribute("data-mid",id);
  document.getElementById("home").classList.add("hidden");
  document.getElementById("manualPage").classList.add("active");
  window.scrollTo(0,0);
}
function goHome(){

}

function initReveal(){
  var els=document.querySelectorAll(".reveal");
  if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(en){
    en.forEach(function(e){ if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);} });
  },{threshold:.12});
  els.forEach(function(e){io.observe(e);});
}
